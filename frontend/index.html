<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Система пропусків у комп’ютерний клас</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./app.ts"></script>
</head>
<body>
  <main class="page">
    <h1 class="page-title">Система пропусків у комп’ютерний клас</h1>

    <section class="panel panel-wide">
      <h2 class="panel-title">Користувачі</h2>
      <form id="userForm" class="user-form">
        <input class="field-input" id="newUserName" placeholder="Name" />
        <select class="field-input" id="newUserRole">
          <option value="user">user</option>
          <option value="student">student</option>
          <option value="admin">admin</option>
        </select>
        <button type="submit" id="userSubmitBtn">Додати user</button>
        <button type="button" id="userResetBtn">Скасувати</button>
      </form>
      <div class="table-wrap">
        <table class="table compact" id="usersTable">
          <thead><tr><th>Name</th><th>Role</th><th>Дії</th></tr></thead>
          <tbody id="usersTbody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel panel-wide">
      <h2 class="panel-title">Поточний користувач</h2>
      <div class="current-user-row">
        <select class="field-input" id="currentUser"></select>
        <span id="currentUserInfo"></span>
      </div>
      <p class="hint">Admin бачить усі заявки. Звичайний user бачить тільки свої.</p>
    </section>

    <section class="panel">
      <h2 class="panel-title" id="formTitle">Нова заявка</h2>
      <form class="form-create" id="passForm" autocomplete="off">
        <label class="field"><span class="field-label">UserName</span></label>
        <div class="readonly-user" id="selectedUserName">—</div>
        <p class="field-error" id="errUserName"></p>

        <label class="field" for="reason"><span class="field-label">Reason</span></label>
        <select class="field-input" id="reason" name="reason">
          <option value="">Оберіть причину</option>
          <option value="Навчальне заняття">Навчальне заняття</option>
          <option value="Олімпіада">Олімпіада</option>
          <option value="Проєкт">Проєкт</option>
          <option value="Консультація">Консультація</option>
        </select>
        <p class="field-error" id="errReason"></p>

        <label class="field" for="validDate"><span class="field-label">ValidDate</span></label>
        <input class="field-input" id="validDate" name="validDate" type="date" />
        <p class="field-error" id="errValidDate"></p>

        <label class="field" for="comment"><span class="field-label">Comment</span></label>
        <textarea class="field-input" id="comment" name="comment" rows="4"></textarea>
        <p class="field-error" id="errComment"></p>

        <label class="field" for="issuer"><span class="field-label">Issuer</span></label>
        <input class="field-input" id="issuer" name="issuer" type="text" />
        <p class="field-error" id="errIssuer"></p>

        <div class="form-actions">
          <button class="btn-submit" id="submitBtn" type="submit" disabled>Додати</button>
          <button class="btn-secondary" id="resetBtn" type="button">Очистити</button>
        </div>
      </form>
      <p class="status-message" id="statusMessage" hidden></p>
      <p class="stats" id="statsMessage"></p>
    </section>

    <section class="panel panel-table">
      <h2 class="panel-title">Список пропусків</h2>
      <div class="filters">
        <input class="field-input" id="filterIssuer" type="text" placeholder="Пошук за Issuer" />
        <select class="field-input" id="filterReason">
          <option value="">Усі причини</option>
          <option value="Навчальне заняття">Навчальне заняття</option>
          <option value="Олімпіада">Олімпіада</option>
          <option value="Проєкт">Проєкт</option>
          <option value="Консультація">Консультація</option>
        </select>
      </div>
      <div class="table-wrap">
        <table class="table" id="passesTable" hidden>
          <thead>
            <tr>
              <th>#</th>
              <th data-sort="userName">UserName</th>
              <th data-sort="reasonName">Reason</th>
              <th data-sort="validDate">ValidDate</th>
              <th data-sort="comment">Comment</th>
              <th data-sort="issuer">Issuer</th>
              <th>Дії</th>
            </tr>
          </thead>
          <tbody id="passesTbody"></tbody>
        </table>
      </div>
    </section>


  </main>
</body>
</html>
